<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="./flood.png" alt="Logo">
        </div>

        <div class="content">
            <h1>Check Weather</h1>
        </div>
    </nav>

    <div class="container">
        <div class="search">
            <input id="city" type="text" placeholder="Enter city name">
            <button id="btn">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
        
        <div class="weather">
            <img src="./weather1.png" alt="" class="weather-icon">
            <h1 class="temp">25°C</h1>
            <h2 class="city">Bhubaneswar</h2>
            <div class="details">
                
                <div class="col">
                    <img src="./waves.png" alt="Waves Image">
                
                    <p class="humidity">50%</p>
                    <p>Humidity</p>
                </div>
                <div class="col1">
                    <img src="./wind.png" alt="Wind Image">
                
                    <p class="wind">5 km/h</p>
                    <p>Wind Speed</p>
                </div>
            </div>
        </div>   
    </div>
<script src="script.js"></script>
    
    
</body>
</html>
